# ---------------------------------------------------------------------------
# Jungle Gaming — Distributed Wagering Processor
# 100% isolated: no host dependencies required.
#
# Full stack:
#   docker compose up --build
#
# Dev workflow (testes, migrations, etc.):
#   docker compose run --rm dev bun test
#   docker compose run --rm dev bun test test/unit
#   docker compose run --rm dev bun test test/integration
#   docker compose run --rm dev bun run migration:run
# ---------------------------------------------------------------------------

x-app-env: &app-env
  NODE_ENV: production
  APP_PORT: 3000
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: wagering
  POSTGRES_USER: wagering
  POSTGRES_PASSWORD: wagering_secret
  DATABASE_URL: postgresql://wagering:wagering_secret@postgres:5432/wagering
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  LOCALSTACK_HOST: localstack
  LOCALSTACK_PORT: 4566
  AWS_ENDPOINT_URL: http://localstack:4566
  SQS_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
  SQS_DLQ_URL: http://localstack:4566/000000000000/wager-transactions-dlq.fifo
  SQS_EVENTS_URL: http://localstack:4566/000000000000/wager-events.fifo
  OUTBOX_POLL_INTERVAL_MS: 2000
  SQS_POLL_WAIT_SECONDS: 20
  SQS_MAX_MESSAGES: 10
  PENDING_REFERENCE_MAX_RETRIES: 5
  GRACEFUL_SHUTDOWN_TIMEOUT_MS: 30000

services:
  # --------------------------------------------------------------------------
  # PostgreSQL 15
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wagering
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - wagering_net

  # --------------------------------------------------------------------------
  # LocalStack (SQS) — pinned to 3.x community edition (no auth token needed)
  # --------------------------------------------------------------------------
  localstack:
    image: localstack/localstack:3
    restart: unless-stopped
    environment:
      SERVICES: sqs
      DEFAULT_REGION: us-east-1
      EAGER_SERVICE_LOADING: 1
      DEBUG: 0
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -q '\"sqs\"'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - wagering_net

  # --------------------------------------------------------------------------
  # Application (NestJS + Bun)
  # Bun transpiles TypeScript at runtime — no build step needed.
  # --------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    networks:
      - wagering_net

  # --------------------------------------------------------------------------
  # Dev service — on-demand only (excluded from `docker compose up`).
  # Uses profiles so it never starts automatically.
  #
  # Usage:
  #   docker compose run --rm dev bun install
  #   docker compose run --rm dev bun test
  #   docker compose run --rm dev bun test test/unit
  #   docker compose run --rm dev bun test test/integration
  # --------------------------------------------------------------------------
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    profiles:
      - tools
    entrypoint: []
    volumes:
      - .:/app
      - dev_node_modules:/app/node_modules
    environment:
      <<: *app-env
      NODE_ENV: development
    networks:
      - wagering_net

volumes:
  postgres_data:
    driver: local
  localstack_data:
    driver: local
  dev_node_modules:
    driver: local

networks:
  wagering_net:
    driver: bridge
